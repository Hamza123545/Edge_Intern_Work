<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg border-0 rounded-4 animated-card" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4 text-primary">Register</h2>
            
            <div class="form-floating mb-3">
                <input id="name" type="text" class="form-control" placeholder="Enter your name" required>
                <label for="name">Name</label>
            </div>
            <div class="form-floating mb-3">
                <input id="email" type="email" class="form-control" placeholder="name@example.com" required>
                <label for="email">Email Address</label>
            </div>
            <div class="form-floating mb-3">
                <input id="password" type="password" class="form-control" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <div class="form-floating mb-3">
                <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm Password" required>
                <label for="confirmPassword">Confirm Password</label>
            </div>

            <button class="btn btn-success w-100 fw-bold animated-btn" onclick="create()">Register</button>
        </div>
    </div>

    <div class="container mt-5">
        <table class="table table-hover shadow-sm rounded-4">
            <thead class="table-success">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Password</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="result"></tbody>
        </table>
    </div>

    <script src="./form.js"></script>
</body>
</html>
